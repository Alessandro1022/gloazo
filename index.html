<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050c1a">
<meta name="description" content="Golazo — sparka bollen genom malen i denna flappy-stil fotbollsmatch.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{ padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html,body{ margin:0; height:100%; }
  [hidden]{ display:none !important; }
</style>
<title>Golazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#050c1a;
    --sky-mid:#0e2c52;
    --sky-horizon:#1f5da3;
    --pitch-dark:#0f3a20;
    --pitch-light:#1c5a30;
    --chalk:#f6f3e7;
    --gold:#ffce3a;
    --gold-deep:#c9860f;
    --crowd:#040910;
    --ink:#081018;
    --danger:#ff5a45;
    --glass: rgba(9,20,38,0.46);
    --glass-line: rgba(246,243,231,0.16);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{ background:var(--sky-top); overflow:hidden; height:100%; }
  html{height:100%;}
  .gfont-display{font-family:'Anton','Arial Narrow',sans-serif;}
  .gfont-body{font-family:'Rubik','Helvetica Neue',Arial,sans-serif;}

  #app{
    position:relative;
    width:100%;
    height:100%;
    min-height:560px;
    max-width:560px;
    margin:0 auto;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    background:var(--sky-top);
  }

  #game{ position:absolute; inset:0; display:block; width:100%; height:100%; }

  #flash{
    position:absolute; inset:0; background:#fff; opacity:0;
    pointer-events:none; z-index:6; mix-blend-mode:screen;
  }

  #hud{
    position:absolute;
    top:0; left:0; right:0;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 0;
    display:flex; align-items:flex-start; justify-content:space-between;
    pointer-events:none; z-index:5;
  }
  .glass-card{
    background:var(--glass);
    border:1px solid var(--glass-line);
    border-radius:16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  #scoreCard{
    padding:6px 22px 8px;
  }
  #score{
    font-size:clamp(34px, 11vw, 50px);
    line-height:1.1;
    color:var(--chalk);
    letter-spacing:0.5px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 26px rgba(255,206,58,0.28);
    font-variant-numeric: tabular-nums;
    transform-origin:center;
  }
  #score.pop{ animation: scorepop 0.32s ease; }
  @keyframes scorepop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.28); color:var(--gold); }
    100%{ transform:scale(1); }
  }
  #best{
    display:flex; align-items:center; gap:7px;
    padding:9px 14px;
    color:var(--gold);
  }
  #best svg{ width:16px; height:16px; flex:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
  #best .bestwrap{ text-align:right; }
  #best .l{ font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:#a9c2d6; }
  #best b{
    display:block; font-family:'Anton','Arial Narrow',sans-serif;
    font-size:19px; color:var(--chalk); letter-spacing:0.5px;
    font-variant-numeric: tabular-nums;
  }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    padding: max(24px, env(safe-area-inset-top,0px)) 24px max(24px, env(safe-area-inset-bottom,0px));
    text-align:center; z-index:10;
    background: radial-gradient(120% 90% at 50% 18%, rgba(20,55,96,0.4), rgba(4,9,16,0.82) 72%);
  }
  .overlay[hidden]{display:none;}
  .panel{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:30px 26px 28px;
    max-width:340px;
    width:100%;
  }

  .badge{
    display:inline-flex; align-items:center; gap:7px;
    background:linear-gradient(180deg, #ffe27a, var(--gold-deep));
    color:#241a02;
    padding:6px 15px 7px; border-radius:999px;
    font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:700;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  h1.title{
    font-size:clamp(42px, 14vw, 68px);
    line-height:0.9; color:var(--chalk);
    text-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 0 40px rgba(255,206,58,0.18);
    margin:2px 0 0;
    text-wrap:balance;
  }
  h1.title em{ display:block; font-style:normal; color:var(--gold); }

  .sub{ color:#c7dbe8; font-size:14.5px; max-width:30ch; line-height:1.55; }
  .sub b{ color:var(--chalk); }

  .cta{
    margin-top:4px; border:none; cursor:pointer;
    background:linear-gradient(180deg, #ffe27a, var(--gold));
    color:#241a02; font-family:'Anton','Arial Narrow',sans-serif;
    font-size:21px; letter-spacing:1px;
    padding:14px 36px 15px; border-radius:14px;
    box-shadow: 0 6px 0 var(--gold-deep), 0 16px 28px rgba(0,0,0,0.4);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .cta:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-deep), 0 8px 16px rgba(0,0,0,0.35); }

  .stat-row{ display:flex; gap:10px; margin-top:2px; width:100%; }
  .stat{
    flex:1; text-align:center; padding:12px 6px 10px;
    background:rgba(255,255,255,0.045);
    border:1px solid var(--glass-line);
    border-radius:12px;
  }
  .stat .n{ font-family:'Anton','Arial Narrow',sans-serif; font-size:30px; color:var(--chalk); font-variant-numeric: tabular-nums; }
  .stat .l{ font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#9fb6c4; margin-top:2px; }
  .stat .n.gold{ color:var(--gold); }

  .hint{
    position:absolute; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    left:0; right:0; text-align:center;
    color:rgba(246,243,231,0.8); font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    pointer-events:none; z-index:4;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .hint{animation:none;} #score.pop{animation:none;} }
  @keyframes pulse{ 0%,100%{opacity:0.32;} 50%{opacity:0.85;} }
</style>

</head>
<body>
<div id="app" class="gfont-body">
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <div id="hud">
    <div class="glass-card" id="scoreCard"><div id="score">0</div></div>
    <div class="glass-card" id="best">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7v2H4v3c0 2.2 1.6 4 3.7 4.4.5 1.3 1.6 2.3 3 2.7V17H8v2h8v-2h-2.7v-2.9c1.4-.4 2.5-1.4 3-2.7C18.4 12 20 10.2 20 8V5h-3V3zM6 8V5h1v4.9C6.4 9.5 6 8.8 6 8zm12 0c0 .8-.4 1.5-1 1.9V5h1v3z"/></svg>
      <div class="bestwrap"><div class="l">Rekord</div><b id="bestVal">0</b></div>
    </div>
  </div>

  <div class="hint" id="hint" hidden>TRYCK ELLER MELLANSLAG FÖR ATT SPARKA</div>

  <div class="overlay" id="startScreen">
    <div class="panel glass-card">
      <span class="badge">Kick-off</span>
      <h1 class="title gfont-display">GOLA<em>ZO</em></h1>
      <p class="sub">Sparka bollen genom <b>varje mål</b>. Missa och matchen är slut. Tryck, klicka eller mellanslag för att skjuta bollen uppåt.</p>
      <button class="cta gfont-display" id="startBtn">SPELA</button>
    </div>
  </div>

  <div class="overlay" id="endScreen" hidden>
    <div class="panel glass-card">
      <span class="badge" id="endBadge">Fullträff</span>
      <h1 class="title gfont-display" id="endTitle">MÅL!</h1>
      <div class="stat-row">
        <div class="stat"><div class="n" id="finalScore">0</div><div class="l">Mål</div></div>
        <div class="stat"><div class="n gold" id="finalBest">0</div><div class="l">Rekord</div></div>
      </div>
      <button class="cta gfont-display" id="retryBtn">SPELA IGEN</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var app = document.getElementById('app');
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestValEl = document.getElementById('bestVal');
  var hintEl = document.getElementById('hint');
  var flashEl = document.getElementById('flash');
  var startScreen = document.getElementById('startScreen');
  var endScreen = document.getElementById('endScreen');
  var startBtn = document.getElementById('startBtn');
  var retryBtn = document.getElementById('retryBtn');
  var finalScoreEl = document.getElementById('finalScore');
  var finalBestEl = document.getElementById('finalBest');
  var endBadge = document.getElementById('endBadge');
  var endTitle = document.getElementById('endTitle');

  var DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2.5));
  var W = 0, H = 0;

  function resize(){
    var rect = app.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();

  var STATE = { START: 0, PLAYING: 1, OVER: 2 };
  var state = STATE.START;

  var bestScore = 0;
  try {
    var stored = localStorage.getItem('golazo-best');
    if (stored) bestScore = parseInt(stored, 10) || 0;
  } catch (e) {}
  bestValEl.textContent = bestScore;

  var GROUND_H, GRAVITY, FLAP_V, BALL_R, GAP, GOAL_W, SPEED, SPAWN_DIST;
  function tuneWorld(){
    GROUND_H = Math.max(64, H * 0.11);
    GRAVITY = H * 2.05;
    FLAP_V = -H * 0.62;
    BALL_R = Math.max(15, Math.min(23, W * 0.048));
    GAP = Math.max(155, H * 0.31);
    GOAL_W = Math.max(58, W * 0.16);
    SPEED = Math.max(150, W * 0.42);
    SPAWN_DIST = Math.max(230, W * 0.62);
  }
  tuneWorld();
  window.addEventListener('resize', function(){ resize(); tuneWorld(); });

  var ball, obstacles, score, groundOffset, cloudOffset, particles, elapsed, trail;
  var shake = 0;
  var stars = [];
  var standLights = [];

  function initDecor(){
    stars = [];
    for (var i = 0; i < 60; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.55, r: Math.random() * 1.4 + 0.3, tw: Math.random() * Math.PI * 2 });
    }
    standLights = [];
    for (var j = 0; j < 18; j++) standLights.push({ x: Math.random(), on: Math.random() > 0.35 });
  }

  function reset(){
    ball = { x: W * 0.30, y: H * 0.42, vy: 0, rot: 0 };
    obstacles = [];
    particles = [];
    trail = [];
    score = 0; groundOffset = 0; cloudOffset = 0; elapsed = 0; shake = 0;
    scoreEl.textContent = '0';
    spawnObstacle(W + 60);
    spawnObstacle(W + 60 + SPAWN_DIST);
  }

  function spawnObstacle(x){
    var minGapY = H * 0.16 + GAP / 2;
    var maxGapY = H - GROUND_H - H * 0.10 - GAP / 2;
    var gapY = minGapY + Math.random() * Math.max(20, (maxGapY - minGapY));
    obstacles.push({ x: x, gapY: gapY, passed: false });
  }

  var kickPulse = 0;

  function flap(){
    if (state === STATE.START) { startGame(); return; }
    if (state === STATE.OVER) return;
    ball.vy = FLAP_V;
    kickPulse = 1;
  }

  function startGame(){
    reset();
    state = STATE.PLAYING;
    startScreen.hidden = true; endScreen.hidden = true; hintEl.hidden = false;
    ball.vy = FLAP_V * 0.65;
  }

  function flashScreen(){
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '0.55';
    requestAnimationFrame(function(){
      flashEl.style.transition = 'opacity 0.4s ease';
      flashEl.style.opacity = '0';
    });
  }

  function endGame(){
    state = STATE.OVER;
    hintEl.hidden = true;
    shake = 1;
    var isRecord = score > bestScore;
    if (isRecord) {
      bestScore = score;
      try { localStorage.setItem('golazo-best', String(bestScore)); } catch (e) {}
    }
    bestValEl.textContent = bestScore;
    finalScoreEl.textContent = score;
    finalBestEl.textContent = bestScore;
    endBadge.textContent = isRecord ? 'Nytt rekord' : 'Matchslut';
    endTitle.textContent = isRecord ? 'REKORD!' : 'FULLTID';
    setTimeout(function(){ endScreen.hidden = false; }, 420);
  }

  function circleRectDist(cx, cy, rx, ry, rw, rh){
    var nearX = Math.max(rx, Math.min(cx, rx + rw));
    var nearY = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nearX, dy = cy - nearY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function update(dt){
    elapsed += dt;
    groundOffset = (groundOffset + SPEED * dt) % 64;
    cloudOffset = (cloudOffset + SPEED * 0.16 * dt) % (W + 200);
    if (kickPulse > 0) kickPulse = Math.max(0, kickPulse - dt * 3.2);
    if (shake > 0) shake = Math.max(0, shake - dt * 2.6);

    if (state !== STATE.PLAYING) return;

    ball.vy += GRAVITY * dt;
    ball.y += ball.vy * dt;
    ball.rot += (0.4 + Math.abs(ball.vy) / (H * 1.4)) * dt * (ball.vy < 0 ? -1 : 1) * 3.2;

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 7) trail.shift();

    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = 0; }

    var groundY = H - GROUND_H;
    if (ball.y + BALL_R >= groundY) { ball.y = groundY - BALL_R; endGame(); }

    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      o.x -= SPEED * dt;

      if (!o.passed && o.x + GOAL_W < ball.x - BALL_R) {
        o.passed = true; score++;
        scoreEl.textContent = String(score);
        scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');
        burst(ball.x, ball.y);
        flashScreen();
      }

      var topH = o.gapY - GAP / 2;
      var botY = o.gapY + GAP / 2;
      var withinX = ball.x + BALL_R > o.x && ball.x - BALL_R < o.x + GOAL_W;
      if (withinX) {
        var hitTop = circleRectDist(ball.x, ball.y, o.x, 0, GOAL_W, topH) < BALL_R;
        var hitBot = circleRectDist(ball.x, ball.y, o.x, botY, GOAL_W, groundY - botY) < BALL_R;
        if (hitTop || hitBot) endGame();
      }
    }

    while (obstacles.length && obstacles[0].x + GOAL_W < -40) obstacles.shift();
    var last = obstacles[obstacles.length - 1];
    if (last && (W - last.x) >= SPAWN_DIST) spawnObstacle(last.x + SPAWN_DIST);

    for (var p = particles.length - 1; p >= 0; p--) {
      particles[p].life -= dt;
      particles[p].x += particles[p].vx * dt;
      particles[p].y += particles[p].vy * dt;
      particles[p].vy += GRAVITY * 0.35 * dt;
      if (particles[p].life <= 0) particles.splice(p, 1);
    }
  }

  function burst(x, y){
    var colors = ['#ffce3a', '#f6f3e7', '#4fd1c5', '#ff5a45'];
    for (var i = 0; i < 14; i++) {
      var a = (Math.PI * 2 * i) / 14;
      var speed = 70 + Math.random() * 70;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 40,
        life: 0.5 + Math.random() * 0.4,
        c: colors[i % colors.length]
      });
    }
  }

  function drawBackground(){
    var g = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
    g.addColorStop(0, '#050c1a'); g.addColorStop(0.5, '#0e2c52'); g.addColorStop(1, '#1f5da3');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H - GROUND_H);

    // stars / dust
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      var tw = 0.5 + 0.5 * Math.sin(elapsed * 1.6 + st.tw);
      ctx.globalAlpha = 0.15 + tw * 0.35;
      ctx.fillStyle = '#dff0ff';
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawFloodlight(W * 0.06, H * 0.05, true);
    drawFloodlight(W * 0.94, H * 0.05, false);

    // stand roof silhouette
    var roofY = H * 0.22;
    ctx.fillStyle = '#02060c';
    ctx.beginPath();
    ctx.moveTo(0, roofY);
    ctx.quadraticCurveTo(W * 0.5, roofY - H * 0.045, W, roofY);
    ctx.lineTo(W, roofY + H * 0.10);
    ctx.lineTo(0, roofY + H * 0.10);
    ctx.closePath();
    ctx.fill();

    // stand light strip
    for (var j = 0; j < standLights.length; j++) {
      var sl = standLights[j];
      var lx = ((sl.x * W + cloudOffset * 0.25) % (W + 20)) - 10;
      var flicker = sl.on ? (0.5 + 0.5 * Math.sin(elapsed * 3 + j)) : 0.15;
      ctx.fillStyle = 'rgba(255,206,58,' + (0.25 + flicker * 0.45) + ')';
      ctx.fillRect(lx, roofY + H * 0.10 - 3, 3, 3);
    }

    // crowd band
    var crowdY = H * 0.32;
    ctx.fillStyle = '#040910';
    ctx.fillRect(0, crowdY, W, H - GROUND_H - crowdY);
    for (var i = 0; i < 34; i++) {
      var cx = ((i * 29 + cloudOffset * 0.5) % (W + 40)) - 20;
      var shade = 12 + ((i * 53) % 22);
      ctx.fillStyle = 'rgb(' + shade + ',' + (shade + 8) + ',' + (shade + 18) + ')';
      ctx.beginPath();
      ctx.arc(cx, crowdY + 6 + (i % 3) * 4, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // vignette
    var vg = ctx.createRadialGradient(W/2, H*0.35, H*0.1, W/2, H*0.35, H*0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H - GROUND_H);
  }

  function drawFloodlight(x, y, faceRight){
    var beamLen = H * 0.62;
    ctx.save();
    ctx.translate(x, y);
    var ang = faceRight ? 0.55 : Math.PI - 0.55;
    var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, beamLen);
    grad.addColorStop(0, 'rgba(255,236,180,0.28)');
    grad.addColorStop(1, 'rgba(255,236,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, beamLen, ang - 0.5, ang + 0.5);
    ctx.closePath();
    ctx.fill();

    var glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 26);
    glow.addColorStop(0, 'rgba(255,255,255,0.95)');
    glow.addColorStop(1, 'rgba(255,206,58,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawGround(){
    var groundY = H - GROUND_H;
    var pg = ctx.createLinearGradient(0, groundY, 0, H);
    pg.addColorStop(0, '#236b39'); pg.addColorStop(0.5, '#1c5a30'); pg.addColorStop(1, '#0f3a20');
    ctx.fillStyle = pg; ctx.fillRect(0, groundY, W, GROUND_H);

    var stripeW = 60;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, groundY, W, GROUND_H); ctx.clip();
    for (var x = -stripeW - (groundOffset % (stripeW * 2)); x < W + stripeW; x += stripeW * 2) {
      ctx.fillStyle = 'rgba(255,255,255,0.055)';
      ctx.fillRect(x, groundY, stripeW, GROUND_H);
    }
    // subtle center arc marking passes by
    ctx.strokeStyle = 'rgba(246,243,231,0.18)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(W * 0.5 - groundOffset * 3 % (W * 3) + W, groundY + GROUND_H * 0.5, GROUND_H * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#f6f3e7';
    ctx.fillRect(0, groundY, W, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, groundY + 4, W, 6);
  }

  function drawGoal(o){
    var groundY = H - GROUND_H;
    var topH = o.gapY - GAP / 2;
    var botY = o.gapY + GAP / 2;
    var botH = groundY - botY;
    drawGoalFrame(o.x, 0, GOAL_W, topH, true);
    drawGoalFrame(o.x, botY, GOAL_W, botH, false);
  }

  function netCurve(x, w, h, hangingFromTop, step){
    // catenary-like sagging net lines drawn as quadratics for a soft 3D feel
    ctx.strokeStyle = 'rgba(246,243,231,0.28)';
    ctx.lineWidth = 1;
    var cols = Math.max(3, Math.round(w / step));
    for (var c = 0; c <= cols; c++) {
      var cx = x + (w / cols) * c;
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.quadraticCurveTo(cx + Math.sin(c) * 3, h * 0.5, cx, h);
      ctx.stroke();
    }
    var rows = Math.max(3, Math.round(h / step));
    for (var r = 0; r <= rows; r++) {
      var ry = (h / rows) * r;
      ctx.beginPath();
      ctx.moveTo(x, ry);
      ctx.quadraticCurveTo(x + w * 0.5, ry + (hangingFromTop ? 3 : -3), x + w, ry);
      ctx.stroke();
    }
  }

  function drawGoalFrame(x, y, w, h, hangingFromTop){
    if (h <= 0) return;
    // soft cast shadow on the field/sky side of the frame's open mouth
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.translate(x, y);

    // net backdrop tint
    ctx.fillStyle = 'rgba(10,26,46,0.34)';
    ctx.fillRect(0, 0, w, h);
    netCurve(0, w, h, hangingFromTop, 13);
    ctx.restore();

    // posts: cylindrical shading via multi-stop gradient
    var postT = Math.max(9, w * 0.15);
    function postGrad(x0, y0, x1, y1){
      var pg = ctx.createLinearGradient(x0, y0, x1, y1);
      pg.addColorStop(0, '#cfcabb');
      pg.addColorStop(0.45, '#f6f3e7');
      pg.addColorStop(0.55, '#fffdf5');
      pg.addColorStop(1, '#b9b39f');
      return pg;
    }

    // mouth edge bar (closest to the gap) — brightest, gold seam facing play
    var edgeY = hangingFromTop ? y + h - postT : y;
    ctx.fillStyle = postGrad(x, edgeY, x, edgeY + postT);
    ctx.fillRect(x, edgeY, w, postT);
    ctx.fillStyle = 'rgba(255,206,58,0.9)';
    ctx.fillRect(x, hangingFromTop ? edgeY + postT - 3 : edgeY, w, 3);

    // outer back bar
    var backY = hangingFromTop ? y : y + h - postT * 0.7;
    ctx.fillStyle = postGrad(x, backY, x, backY + postT * 0.7);
    ctx.globalAlpha = 0.9;
    ctx.fillRect(x, backY, w, postT * 0.7);
    ctx.globalAlpha = 1;

    // side posts
    ctx.fillStyle = postGrad(x, y, x + postT * 0.7, y);
    ctx.fillRect(x, y, postT * 0.7, h);
    ctx.fillStyle = postGrad(x + w - postT * 0.7, y, x + w, y);
    ctx.fillRect(x + w - postT * 0.7, y, postT * 0.7, h);

    // corner shadow accents
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(x, y, postT * 0.7, 4);
    ctx.fillRect(x + w - postT * 0.7, y, postT * 0.7, 4);
  }

  function drawBallShape(x, y, r, rot, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rot);

    // drop shadow (cast toward ground, fades with height not modeled — soft constant)
    ctx.save();
    ctx.rotate(-rot);
    ctx.beginPath();
    ctx.ellipse(0, r * 0.15, r * 0.9, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.001)';
    ctx.restore();

    // sphere shading
    var sphere = ctx.createRadialGradient(-r*0.35, -r*0.4, r*0.12, 0, 0, r*1.05);
    sphere.addColorStop(0, '#ffffff');
    sphere.addColorStop(0.55, '#f0ede0');
    sphere.addColorStop(0.85, '#cfc9b8');
    sphere.addColorStop(1, '#a29c8a');
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = sphere; ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.strokeStyle = 'rgba(20,20,18,0.55)';
    ctx.stroke();

    // pentagon pattern
    ctx.fillStyle = 'rgba(26,26,24,0.88)';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.30, 0, Math.PI * 2); ctx.fill();
    for (var i = 0; i < 5; i++) {
      var a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      var px = Math.cos(a) * r * 0.60, py = Math.sin(a) * r * 0.60;
      ctx.beginPath(); ctx.arc(px, py, r * 0.19, 0, Math.PI * 2); ctx.fill();
    }
    // specular highlight
    ctx.beginPath();
    ctx.ellipse(-r*0.32, -r*0.38, r*0.22, r*0.13, -0.6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
    ctx.restore();
  }

  function drawBall(){
    for (var i = 0; i < trail.length; i++) {
      var t = trail[i];
      var a = (i / trail.length) * 0.16;
      drawBallShape(t.x, t.y, BALL_R * (0.7 + 0.3 * i / trail.length), ball.rot, a);
    }
    // ground contact shadow
    var groundY = H - GROUND_H;
    var distToGround = Math.max(0, groundY - (ball.y + BALL_R));
    var shadowScale = Math.max(0.25, 1 - distToGround / (H * 0.5));
    ctx.save();
    ctx.globalAlpha = 0.28 * shadowScale;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(ball.x, groundY + 3, BALL_R * shadowScale, BALL_R * 0.32 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawBallShape(ball.x, ball.y, BALL_R * (1 + kickPulse * 0.1), ball.rot, 1);
  }

  function drawParticles(){
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / 0.7);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.save();
    if (shake > 0) {
      var mag = shake * 8;
      ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }
    ctx.clearRect(-20, -20, W + 40, H + 40);
    drawBackground();
    for (var i = 0; i < obstacles.length; i++) drawGoal(obstacles[i]);
    drawGround();
    drawParticles();

    if (state === STATE.START) {
      var bobY = H * 0.42 + Math.sin(elapsed * 2.4) * 8;
      ball.x = W * 0.5; ball.y = bobY; ball.rot = Math.sin(elapsed * 2.4) * 0.12;
      drawBallShape(ball.x, ball.y, BALL_R, ball.rot, 1);
    } else {
      drawBall();
    }
    ctx.restore();
  }

  var lastT = null;
  function loop(t){
    if (lastT === null) lastT = t;
    var dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function onPress(e){
    if (e && e.type === 'keydown') {
      if (e.code !== 'Space' && e.key !== ' ') return;
      e.preventDefault();
    }
    if (e && e.cancelable && e.type !== 'keydown') e.preventDefault();
    if (state === STATE.OVER) return;
    flap();
  }
  app.addEventListener('pointerdown', onPress);
  window.addEventListener('keydown', onPress);
  startBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  retryBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

  initDecor();
  ball = { x: W * 0.5, y: H * 0.42, vy: 0, rot: 0 };
  obstacles = []; particles = []; trail = []; score = 0;
})();
</script>

</body>
</html>
